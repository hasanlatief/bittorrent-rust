[package]
name = "codecrafters-bittorrent"
version = "0.1.0"
authors = ["Codecrafters <hello@codecrafters.io>"]
edition = "2024"

[dependencies]
anyhow = "1.0.104"                                                  # error handling
clap = { version = "4.6.4", features = ["derive"] }
libc = "0.2.189"
nom = "8.0.0"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.4", features = ["json", "blocking", "query"] } # http requests
serde = { version = "1.0.136", features = ["derive"] }             # for json mangling
serde_json = "1.0.105"                                             # for json mangling
sha1 = "0.10.1"                                                    # hashing
tokio = { version = "1.23.0", features = ["full"] }                # async http requests
url = "2.5.8"
